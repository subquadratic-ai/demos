[project]
name = "subq-listing-match"
version = "0.1.0"
description = "Screen every listing in a city against a guest's brief: SubQ System One decisions vs popular LLMs on speed and cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
listing-bench = "listing_match.bench:main"
listing-match-app = "listing_match.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["listing_match"]
