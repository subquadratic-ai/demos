<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context curation</title>
<style>
  @font-face { font-family: Plex; src: url(/fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Plex; src: url(/fonts/IBMPlexSans-Medium.ttf); font-weight: 500; }
  @font-face { font-family: Plex; src: url(/fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: PlexMono; src: url(/fonts/IBMPlexMono-Regular.ttf); font-weight: 400; }
  @font-face { font-family: PlexMono; src: url(/fonts/IBMPlexMono-Medium.ttf); font-weight: 500; }
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #141311; --muted: #77726a; --line: #e4e0d8;
    --navy: #233a7a; --keep: #2f7d3a; --keep-bg: #e7f3e4; --range: #3c5bd0; --range-bg: #e6ebfb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Plex, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 40px 56px; gap: 20px; overflow: hidden; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .eyebrow { font: 500 13px PlexMono, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 0; font-size: 40px; font-weight: 600; letter-spacing: -.01em; }
  .controls { display: flex; align-items: center; gap: 16px; }
  button { font: 500 17px Plex, sans-serif; color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 13px 26px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .clock { font: 500 15px PlexMono, monospace; color: var(--muted); min-width: 260px; text-align: right; }
  .clock b { color: var(--ink); font-size: 22px; font-weight: 500; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; display: flex; gap: 18px; align-items: baseline; }
  .task .eyebrow { flex: none; }
  .task p { margin: 0; font-size: 17px; line-height: 1.45; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.65fr 1fr; gap: 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; position: relative; transition: border-color .3s, box-shadow .3s; }
  .panel.live { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(35,58,122,.15); }
  .panel h2 { margin: 0; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 span { font: 400 14px PlexMono, monospace; color: var(--muted); }
  .tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 1fr; gap: 6px; }
  .tile { border: 1px solid var(--line); border-radius: 7px; padding: 6px 7px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; background: #fff; transition: opacity .45s, background .3s, border-color .3s; }
  .tile .nm { font: 500 12.5px PlexMono, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .dir { font: 400 10.5px PlexMono, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .p { font: 500 12px PlexMono, monospace; color: var(--muted); opacity: 0; transition: opacity .3s; }
  .tile.scan::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(35,58,122,.13) 50%, transparent 80%); background-size: 250% 100%; animation: sweep 1.1s linear infinite; animation-delay: var(--d); }
  @keyframes sweep { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .tile.scored .p { opacity: 1; }
  .tile.drop { opacity: .28; }
  .tile.keep { background: var(--keep-bg); border-color: var(--keep); }
  .tile.keep .p { color: var(--keep); font-size: 14px; }
  .packet { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: 16px; margin: auto; text-align: center; }
  .pf { display: flex; flex-direction: column; gap: 7px; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
  .pf.in { opacity: 1; transform: none; }
  .pf .row { display: flex; justify-content: space-between; align-items: baseline; }
  .pf .path { font: 500 16px PlexMono, monospace; }
  .pf .meta { font: 400 13px PlexMono, monospace; color: var(--muted); }
  .bar { height: 22px; background: #f1efea; border-radius: 5px; position: relative; overflow: hidden; }
  .bar.scan::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(60,91,208,.18), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: slide 1s linear infinite; }
  @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--range); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .5s ease-out; }
  .bar i.in { transform: none; }
  .ranges { font: 400 13px PlexMono, monospace; color: var(--range); min-height: 17px; }
  .sum { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: none; gap: 26px; align-items: flex-end; }
  .sum.in { display: flex; }
  .sum .big { font: 500 46px PlexMono, monospace; line-height: 1; }
  .sum .lbl { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .stats { display: flex; gap: 28px; font: 400 14px PlexMono, monospace; color: var(--muted); min-height: 20px; }
  .stats b { color: var(--ink); font-weight: 500; }
  .err { color: #b3261e; font-size: 15px; }

  /* Square and tall windows: repository on top, packet below. */
  @media (max-aspect-ratio: 5/4) {
    body { padding: 28px 30px; gap: 14px; }
    h1 { font-size: 32px; }
    .clock { min-width: 0; }
    .task p { font-size: 15px; }
    .task { padding: 12px 18px; }
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
    .panel { padding: 14px 16px; gap: 10px; }
    .tiles { grid-template-columns: repeat(9, 1fr); gap: 4px; }
    .tile { padding: 0 6px; flex-direction: row; align-items: center; gap: 4px; }
    .tile > div:first-child { min-width: 0; flex: 1; }
    .tile .nm { font-size: 11px; } .tile .dir { display: none; } .tile .p, .tile.keep .p { font-size: 11px; flex: none; }
    .packet { gap: 6px; } .pf { gap: 3px; } .pf .path { font-size: 14px; } .pf .meta { font-size: 12px; }
    .bar { height: 12px; } .ranges { font-size: 12px; min-height: 15px; }
    .stats { font-size: 13px; min-height: 0; }
    .sum { padding-top: 10px; } .sum .big { font-size: 30px; } .sum .lbl { font-size: 13px; margin-top: 3px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Context curation · SubQ Snap</div>
    <h1>Which code does the agent need?</h1>
  </div>
  <div class="controls">
    <div class="clock" id="clock"></div>
    <button id="run">Curate context</button>
  </div>
</header>
<div class="task"><span class="eyebrow">Task</span><p id="task"></p></div>
<main>
  <section class="panel" id="repoPanel">
    <h2>Repository <span id="repoMeta"></span></h2>
    <div class="tiles" id="tiles"></div>
    <div class="stats" id="stats1"></div>
  </section>
  <section class="panel" id="packetPanel">
    <h2>Context packet <span id="packetMeta"></span></h2>
    <div class="packet" id="packet"><div class="empty">The agent starts from what Snap keeps.</div></div>
    <div class="stats" id="stats2"></div>
    <div class="sum" id="sum"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("en-US");
let repo = null, busy = false, t0 = 0, label = "", ticking = false;

function clock(text, secs, done) {
  $("#clock").innerHTML = `${text} <b>${secs.toFixed(2)}s</b>`;
}
function tick() {
  if (!ticking) return;
  clock(label, (performance.now() - t0) / 1000);
  requestAnimationFrame(tick);
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function init() {
  repo = await (await fetch("/api/repo")).json();
  $("#task").textContent = repo.task;
  $("#repoMeta").textContent = `${repo.repo} · ${repo.files.length} files · ${fmt(repo.lines)} lines`;
  $("#tiles").innerHTML = repo.files.map((f, i) => {
    const parts = f.path.split("/"), nm = parts.pop(), dir = parts.join("/") || "/";
    return `<div class="tile" id="t${i}" style="--d:${(i % 10) * 0.05}s" title="${f.path}">
      <div><div class="nm">${nm}</div><div class="dir">${dir}</div></div><div class="p"></div></div>`;
  }).join("");
  if (new URLSearchParams(location.search).has("autorun")) setTimeout(run, 900);
}

async function run() {
  if (busy) return; busy = true;
  $("#run").disabled = true;
  try {
    // Pass 1: the whole repository, one request, one question per file.
    $("#repoPanel").classList.add("live");
    document.querySelectorAll(".tile").forEach(t => t.classList.add("scan"));
    label = `Snap reading ${repo.files.length} files ·`; t0 = performance.now(); ticking = true; tick();
    const p1 = await post("/api/pass1");
    ticking = false;
    document.querySelectorAll(".tile").forEach(t => t.classList.remove("scan"));
    $("#repoPanel").classList.remove("live");
    $("#stats1").innerHTML = `<span>1 request</span><span><b>${fmt(p1.usage.input_tokens)}</b> tokens</span><span>answered in <b>${p1.seconds.toFixed(2)}s</b></span>`;
    const kept = [];
    repo.files.forEach((f, i) => {
      const t = $("#t" + i), p = p1.scores[i];
      t.querySelector(".p").textContent = p.toFixed(2);
      t.classList.add("scored", p >= p1.keep ? "keep" : "drop");
      if (p >= p1.keep) kept.push({ ...f, p });
    });
    kept.sort((a, b) => b.p - a.p);
    await sleep(900);

    // The kept files move to the packet; pass 2 picks the line ranges inside them.
    $("#packetMeta").textContent = `${kept.length} of ${repo.files.length} files kept`;
    $("#packet").innerHTML = kept.map((f, k) => `<div class="pf" id="pf${k}">
      <div class="row"><span class="path">${f.path}</span><span class="meta">p ${f.p.toFixed(2)} · ${fmt(f.lines)} lines</span></div>
      <div class="bar scan" id="bar${k}"></div><div class="ranges" id="rg${k}"></div></div>`).join("");
    for (let k = 0; k < kept.length; k++) { await sleep(110); $("#pf" + k).classList.add("in"); }
    $("#packetPanel").classList.add("live");
    label = "Snap picking line ranges ·"; t0 = performance.now(); ticking = true; tick();
    const p2 = await post("/api/pass2", { paths: kept.map(f => f.path) });
    ticking = false;
    $("#packetPanel").classList.remove("live");
    let nRanges = 0;
    kept.forEach((f, k) => {
      const bar = $("#bar" + k); bar.classList.remove("scan");
      const rs = p2.packet.ranges[f.path] || [];
      nRanges += rs.length;
      bar.innerHTML = rs.map(([a, b]) => `<i style="left:${(a - 1) / f.lines * 100}%;width:${Math.max(0.6, (b - a + 1) / f.lines * 100)}%"></i>`).join("");
      $("#rg" + k).textContent = rs.length ? "lines " + rs.map(([a, b]) => `${a}–${b}`).join(", ") : "no lines picked";
    });
    await sleep(30);
    document.querySelectorAll(".bar i").forEach(i => i.classList.add("in"));
    $("#stats2").innerHTML = `<span>1 request</span><span><b>${fmt(p2.usage.input_tokens)}</b> tokens</span><span>answered in <b>${p2.seconds.toFixed(2)}s</b></span>`;
    await sleep(500);
    const pct = p2.packet.lines / repo.lines * 100;
    $("#sum").innerHTML = `<div><div class="big">${fmt(p2.packet.lines)}</div><div class="lbl">lines for the agent</div></div>
      <div><div class="big">${pct.toFixed(1)}%</div><div class="lbl">of ${fmt(repo.lines)} lines in the repo</div></div>
      <div><div class="big">${nRanges}</div><div class="lbl">line ranges in ${kept.length} files</div></div>`;
    $("#sum").classList.add("in");
    clock("Decided in", p1.seconds + p2.seconds, true);
    window.__result = { p1, p2, kept: kept.map(f => f.path), ranges: nRanges, repoLines: repo.lines, files: repo.files.length };
  } catch (e) {
    ticking = false;
    $("#clock").innerHTML = `<span class="err">${e.message}</span>`;
  }
  busy = false; $("#run").disabled = false; $("#run").textContent = "Run again";
}
$("#run").addEventListener("click", run);
addEventListener("keydown", e => { if (e.key === "Enter") run(); });
init();
</script>
</body>
</html>
